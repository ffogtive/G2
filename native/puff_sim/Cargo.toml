[package]
name = "puff_sim"
version = "0.1.0"
edition = "2021"
description = "PUFF! 딱지 물리 — mockup/src/sim.js 의 Rust(rapier3d 0.36) 포팅 + C ABI (B 시제품)"
publish = false
license = "UNLICENSED"

[lib]
# rlib = CLI·테스트, cdylib = 안드로이드/리눅스 .so (dart:ffi DynamicLibrary.open), staticlib = iOS (xcframework 로 묶어 정적 링크)
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# enhanced-determinism: libm 강제 + glam 스칼라 코어 + IndexMap → 같은 입력이면 x86·ARM·WASM 이 비트 단위로 같다(rapier 의 계약)
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }
# 바람 모델의 sin/cos/exp/pow/tanh/log 도 플랫폼 libm(iOS·안드로이드 libc 가 다름) 대신 순수 Rust libm 으로 → 기기 간 같은 비트
libm = "0.2.16"

[[bin]]
name = "puff_parity"
path = "src/bin/puff_parity.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
