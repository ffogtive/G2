<title>PUFF! Ddakji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Lilita+One&display=swap">
<style>
/* 레이아웃: 풀스크린 3D 책상 위에 클래시풍 두툼한 UI를 얹는다. 게임 세계 하나로 고정된 단일 테마. */
:root {
  --ink: #2a1a12;
  --cream: #fff6e0;
  --gold: #ffcf33;
  --go: #5ad43b;
  --go-dark: #2f9a1a;
  --sky: #3a8fe0;
  --sky-dark: #2457b0;
  --red: #ff4d5e;
  --panel: #fff3d6;
  --shade: rgba(42, 26, 18, 0.55);
  --display: "Lilita One", "Black Han Sans", "Arial Black", system-ui, sans-serif;
  --display-ko: "Black Han Sans", "Lilita One", "Arial Black", system-ui, sans-serif;
  --body: "Jua", "Lilita One", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: #7cc7ff; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
:lang(ko) .disp, :lang(ko) .btn, :lang(ko) .banner, :lang(ko) .big { font-family: var(--display-ko); }
#app { position: fixed; inset: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fxl { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(20,10,40,0.75) 100%); transition: opacity 0.1s; }
.screen { position: absolute; inset: 0; pointer-events: none; }
.screen > * { pointer-events: auto; }
.screen[hidden] { display: none !important; }

/* 공통: 굵은 외곽선 글자 */
.stroke { color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }

.btn {
  font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.02em; color: #fff; cursor: pointer;
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink);
  background: linear-gradient(#8ef05a, var(--go) 55%, var(--go-dark));
  border: 3px solid var(--ink); border-radius: 18px; padding: 0.55em 1.2em;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,0.18), inset 0 3px 0 rgba(255,255,255,0.55), 0 5px 0 var(--ink);
  transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18), inset 0 3px 0 rgba(255,255,255,0.55), 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.blue { background: linear-gradient(#7fc1ff, var(--sky) 55%, var(--sky-dark)); }
.btn.gold { background: linear-gradient(#fff07a, var(--gold) 55%, #e09a00); }
.btn.ghost { background: rgba(255,255,255,0.18); font-size: 0.85rem; padding: 0.45em 0.9em; box-shadow: 0 3px 0 var(--ink); }
.btn.xl { font-size: 2rem; padding: 0.35em 1.6em; border-radius: 24px; }
.btn small { font-size: 0.7em; opacity: 0.9; }
.pill { font-family: var(--display); font-size: 1rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; background: rgba(42,26,18,0.6); border: 2px solid var(--ink); border-radius: 999px; padding: 0.3em 0.8em; display: inline-flex; align-items: center; gap: 0.4em; cursor: pointer; }
.pill.off { opacity: 0.55; }
.pill svg { width: 1.1em; height: 1.1em; }

/* 부트 */
#boot { display: grid; place-items: center; background: linear-gradient(#5fc8ff, #ffe7b8); }
#boot p { font-family: var(--display); font-size: 1.4rem; text-align: center; padding-inline: 16px; max-width: 32ch; }

/* 홈 */
#home { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); box-sizing: border-box; }
.topbar { display: flex; gap: 8px; width: 100%; max-width: 640px; justify-content: space-between; align-items: center; }
.topbar .right { display: flex; gap: 8px; }
.mini-disc { width: 1.2em; height: 1.2em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a8, #e0b25a); border: 2px solid var(--ink); display: inline-block; }
.logo { text-align: center; margin-top: 2vh; }
.logo h1 { margin: 0; font-family: var(--display); font-size: clamp(4rem, 17vw, 7.5rem); line-height: 0.9; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink), 0 14px 18px rgba(0,0,0,0.25); transform: rotate(-4deg); animation: bob 2.6s ease-in-out infinite; }
.logo h1 span { color: #fff; }
.logo p { margin: 0.4em 0 0; font-size: 1.25rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); }
@keyframes bob { 50% { transform: rotate(-2deg) translateY(-6px); } }
.home-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 520px; }
.bet { display: flex; align-items: center; gap: 10px; background: rgba(42,26,18,0.55); border: 3px solid var(--ink); border-radius: 18px; padding: 8px 12px; }
.bet .lbl { font-family: var(--display); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
#chips { display: flex; gap: 8px; }
#chips button { font-family: var(--display); font-size: 1.3rem; width: 3.1em; height: 2.2em; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
#chips button.on { background: linear-gradient(#fff07a, var(--gold)); transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
#chips button:disabled { opacity: 0.35; cursor: not-allowed; }
/* PvP (P0.5a 두 탭): 로비 · 샷 시계 · 상대 연결 */
#pvpChips { display: flex; gap: 8px; }
#pvpChips button { font-family: var(--display); font-size: 1.3rem; width: 3.1em; height: 2.2em; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
#pvpChips button.on { background: linear-gradient(#fff07a, var(--gold)); transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.pvp-panel > * + * { margin-top: 12px; }
.pvp-panel #pvpPick, .free-pick { display: grid; gap: 12px; justify-items: center; }
#pvpCodeIn { font-family: var(--display); font-size: 1.6rem; width: 5.6em; text-align: center; text-transform: uppercase; letter-spacing: 0.18em; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 8px; background: #fff; color: var(--ink); user-select: text; -webkit-user-select: text; }
.pvp-err { color: var(--red); font-size: 1rem; margin: 8px 0 0; }
.pvp-clock { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 50%; transform: translateX(-50%); min-width: 2.2em; text-align: center; font-family: var(--display); font-size: 1.35rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; background: rgba(42,26,18,0.55); border: 3px solid var(--ink); border-radius: 14px; padding: 0 10px; pointer-events: none; }
.pvp-clock.low { background: rgba(255,77,94,0.9); }
.pvp-clock.ai { opacity: 0.75; }
.pvp-conn { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 104px); left: 50%; transform: translateX(-50%); max-width: 86vw; background: rgba(42,26,18,0.85); color: #fff; padding: 6px 12px; border-radius: 12px; text-align: center; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* HUD */
#hud .top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; pointer-events: none; }
.score { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 2rem; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
.score.ai { justify-content: flex-end; }
.score .who { font-size: 0.9rem; -webkit-text-stroke: 1px var(--ink); display: block; line-height: 1; }
.score .ava { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); background: #ffd8a8; display: grid; place-items: center; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
.score .ava img { width: 100%; height: 100%; }
.score.bump b { animation: bump 0.25s; display: inline-block; }
@keyframes bump { 40% { transform: scale(1.45); color: var(--gold); } }
.pot { font-family: var(--display); text-align: center; background: rgba(42,26,18,0.6); border: 3px solid var(--ink); border-radius: 14px; padding: 2px 12px; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
.pot span { font-size: 0.8rem; display: block; line-height: 1; opacity: 0.85; }
.pot b { font-size: 1.6rem; line-height: 1.1; }
#hud.no-pot .pot { visibility: hidden; } /* 레벨 라이벌 판: 판돈 상자 없음(가운데 칸 자리는 유지) */
#quitBtn { position: absolute; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
/* 9차: 입술 높이 2단 레일(오른쪽 아래, HOME 과 거울 자리). 탭으로 칸 고르기. 누르는 동안·상대 차례엔 숨김 */
#lipRail { position: absolute; right: 10px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 4px); width: 56px; height: 120px; border-radius: 28px; background: rgba(42,26,18,0.55); border: 3px solid #2a1a12; box-shadow: 0 3px 0 #2a1a12; touch-action: none; }
#lipRail .notch { position: absolute; left: 0; width: 100%; height: 56px; background: none; border: 0; padding: 0; cursor: pointer; }
#lipRail .notch[data-pose="eye"] { top: 2px; } #lipRail .notch[data-pose="low"] { bottom: 2px; }
#lipRail .notch::after { content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 4px; margin: -2px 0 0 -7px; border-radius: 2px; background: rgba(255,255,255,0.5); }
#lipRail .lipHandle { position: absolute; left: 6px; width: 40px; height: 24px; top: 16px; border-radius: 12px 12px 14px 14px; background: radial-gradient(ellipse at 50% 35%, #f6a3ad, #d4566a 60%, #a8304a); border: 2.5px solid #2a1a12; transition: top 0.25s ease; pointer-events: none; }
#lipRail.low .lipHandle { top: 74px; }
#lipRail.off .notch[data-pose="low"] { opacity: 0.35; cursor: not-allowed; }
#lipRail .lipLbl { position: absolute; right: 62px; font-family: var(--display); font-size: 0.8rem; color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; white-space: nowrap; pointer-events: none; opacity: 0.85; }
#lipRail .lipLbl.eye { top: 20px; } #lipRail .lipLbl.low { bottom: 20px; }
#lipRail.low .lipLbl.low, #lipRail:not(.low) .lipLbl.eye { color: #ffe27a; }
/* 9차: 물안경(초록 숨 가이드 아이템). 레일 위. 탭 = 이번 숨에 쓰기(놓을 때 1개), 다시 탭 = 취소 */
#goggles { position: absolute; right: 10px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 136px); width: 56px; height: 56px; border-radius: 50%; background: #bfe9ff; border: 3px solid #2a1a12; box-shadow: 0 3px 0 #2a1a12; padding: 0; cursor: pointer; }
#goggles .lens { position: absolute; left: 7px; top: 15px; width: 36px; height: 18px; border-radius: 9px; background: linear-gradient(90deg, #5fd3ff 0 46%, #2a1a12 46% 54%, #5fd3ff 54%); border: 2.5px solid #2a1a12; }
#goggles b { position: absolute; right: -6px; bottom: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: #ff5d73; color: #fff; font: 700 13px/22px var(--display); border: 2px solid #2a1a12; }
#goggles.on { background: #6dffb0; transform: scale(1.08); }
#goggles.empty { filter: grayscale(1); opacity: 0.6; }
#goggles.nudge { animation: gogNudge 0.9s ease-in-out infinite; }
@keyframes gogNudge { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px) rotate(-6deg); } 60% { transform: translateY(-4px) rotate(5deg); } }
#puffWrap { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(46vw, 230px); aspect-ratio: 1; pointer-events: none; transition: bottom 0.3s, top 0.3s; }
#puffWrap.ai { bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 64px); width: min(26vw, 140px); }
#puffCanvas { width: 100%; height: 100%; }
.hint { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); text-align: center; pointer-events: none; font-family: var(--display); font-size: 1.3rem; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: normal; width: max-content; max-width: 88vw; word-break: keep-all; overflow-wrap: break-word; }
.hint .hand { width: 54px; height: 54px; margin: 0 auto 6px; border-radius: 50%; background: rgba(255,255,255,0.85); border: 3px solid var(--ink); position: relative; animation: pull 1.6s ease-in-out infinite; }
.hint .hand::after { content: ""; position: absolute; left: 50%; top: 100%; width: 4px; height: 40px; background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0)); transform: translateX(-50%); }
@keyframes pull { 0%, 15% { transform: translateY(-40px) scale(1); } 20% { transform: translateY(-40px) scale(0.85); } 75% { transform: translateY(40px) scale(0.85); } 85%, 100% { transform: translateY(40px) scale(1.15); opacity: 0; } }
.hint .hand { display: none; } /* 6차: 더미 위 손가락 시범(drawTapGuide)이 대신 */
#puffWrap.fpvhide { opacity: 0; visibility: hidden; transition: none; } /* 6차: 내 차례엔 1인칭(볼·입술)이 대신 */

/* 배너 & 큰 글자 */
.banner, .big { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-family: var(--display); white-space: nowrap; pointer-events: none; text-align: center; }
.banner { font-size: clamp(2rem, 9vw, 3.6rem); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); padding: 0.1em 0.8em; border-radius: 20px; }
.banner.b-me { background: linear-gradient(90deg, rgba(90,212,59,0), rgba(90,212,59,0.85), rgba(90,212,59,0)); }
.banner.b-ai { background: linear-gradient(90deg, rgba(255,77,94,0), rgba(255,77,94,0.85), rgba(255,77,94,0)); }
.banner.go { animation: slam 0.9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes slam { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; } 28% { transform: translate(-50%, -50%) scale(1.04); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
.big { top: 24%; font-size: clamp(2.6rem, 12vw, 5.4rem); color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 10px 24px rgba(0,0,0,0.3); line-height: 1; }
.big small { display: block; font-size: 0.36em; color: #fff; -webkit-text-stroke: 2px var(--ink); margin-top: 0.2em; }
.big.r0 { color: #cfd6e6; font-size: clamp(2.2rem, 10vw, 4.2rem); }
.big.r1 { color: #9ff07a; }
.big.r2 { color: var(--gold); }
.big.r3 { color: #ff9f2e; }
.big.r4 { color: #ff4fa0; font-size: clamp(3rem, 14vw, 6.4rem); }
.big.ai { filter: saturate(0.6) brightness(0.95); }
.big.go { animation: pop 1.15s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; } 34% { transform: translate(-50%, -50%) scale(0.97) rotate(-1deg); } 82% { opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1) rotate(0); opacity: 0; } }

/* 떠오르는 글자 */
.float { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 1.6rem; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); animation: rise 1.3s ease-out both; white-space: nowrap; }
.float.plus { color: #9ff07a; font-size: 2rem; }
.breath-fb.fbCough { color: #ffb3b3; }
.float.out { color: #ffffff; font-size: 1.5rem; background: #e2452f; padding: 0 8px; border-radius: 8px; -webkit-text-stroke: 0; }
.big small.outs { display: block; color: #ffd1c9; font-size: 0.42em; }
.float.rar { font-size: 1rem; padding: 2px 8px; border-radius: 8px; border: 2px solid var(--ink); -webkit-text-stroke: 1px var(--ink); }
.float.warn { color: var(--red); font-size: 1.8rem; }
.r-rare.float, .float.r-rare { background: #2f7fd6; }
.float.r-epic { background: #8a3ad6; }
.float.r-legendary { background: #e08a00; }
@keyframes rise { 0% { transform: translate(-50%, -20%) scale(0.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 30% { transform: translate(-50%, -60%) scale(1); } 100% { transform: translate(-50%, -180%) scale(1); opacity: 0; } }

/* VS 스플래시 */
#vs { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
#vs .card { display: grid; gap: 10px; justify-items: center; background: linear-gradient(#fff6e0, #ffe2a8); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 26px; box-shadow: 0 8px 0 var(--ink); }
#vs .vsrow { display: flex; align-items: center; gap: 16px; font-family: var(--display); font-size: 1.5rem; }
#vs .vsrow .vsx { font-size: 3rem; color: var(--red); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
#vsBait { font-size: 1rem; display: flex; align-items: center; gap: 6px; }
#vsBait img { width: 34px; height: 34px; }
#vs.go .card { animation: vsIn 1.7s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes vsIn { 0% { transform: scale(0.3); opacity: 0; } 15% { transform: scale(1.05); opacity: 1; } 22% { transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.2); } }
.r-rare { color: #2f7fd6; } .r-epic { color: #8a3ad6; } .r-legendary { color: #e08a00; } .r-common { color: #7a6a52; }

/* 결과 & 앨범 패널 */
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 520px); max-height: 88vh; overflow: auto; box-sizing: border-box; background: linear-gradient(#fff9ea, var(--panel)); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 16px; box-shadow: 0 8px 0 var(--ink), 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
.res-title { margin: 0; font-family: var(--display); font-size: clamp(2.6rem, 11vw, 4rem); color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.res-title.lose { color: #b9c3d9; }
.res-title.draw { color: #fff; }
#resScore { font-family: var(--display); font-size: 2.6rem; display: flex; justify-content: center; gap: 14px; align-items: baseline; }
#resScore span { opacity: 0.5; }
#resNet { font-size: 1.2rem; }
#resNet .pos { color: var(--go-dark); } #resNet .neg { color: var(--red); }
#resCards { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin: 12px 0; }
.rc { position: relative; animation: cardIn 0.4s cubic-bezier(.2,1.5,.4,1) both; }
.rc img { width: 100%; display: block; filter: drop-shadow(0 3px 0 var(--ink)); }
.rc i, .ac i { position: absolute; right: -2px; bottom: -2px; font-style: normal; font-family: var(--display); font-size: 0.85rem; background: var(--ink); color: #fff; border-radius: 8px; padding: 0 5px; }
.rc em { position: absolute; left: 50%; top: -6px; transform: translateX(-50%) rotate(-6deg); font-style: normal; font-family: var(--display); font-size: 0.8rem; background: var(--red); color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; }
@keyframes cardIn { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
.album-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.album-head h2 { margin: 0; font-family: var(--display); font-size: 1.8rem; }
.bar { height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: #e9d9b6; overflow: hidden; margin: 10px 0 4px; }
.bar div { height: 100%; background: linear-gradient(#9ff07a, var(--go)); width: 0; transition: width 0.6s; }
#albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; margin-top: 12px; }
.ac { position: relative; display: grid; gap: 2px; justify-items: center; font-size: 0.8rem; }
